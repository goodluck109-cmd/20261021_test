<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f0e7"><title>오늘의 카페 | 메뉴 주문</title>
<style>
:root{--cream:#fbf7f0;--paper:#fffdf9;--ink:#34251f;--muted:#826f63;--brown:#704a35;--line:#eadfd2;--green:#62765b}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #3b82f6;outline-offset:3px}header{padding:25px 18px 32px;background:linear-gradient(135deg,#f1dfc8,#fcf7ef 65%,#e6d6bd);text-align:center;border-bottom:1px solid var(--line)}.brand{font-size:12px;letter-spacing:.22em;color:var(--brown);font-weight:800}.hero-title{font-family:Georgia,serif;font-size:clamp(36px,6vw,56px);margin:8px 0;color:#563a2b}.hero-copy{color:var(--muted);line-height:1.7;margin:0}.music{margin-top:18px;border:1px solid #c7a98b;background:#fffaf3;color:#694a35;padding:10px 16px;border-radius:999px}main{max-width:1100px;margin:auto;padding:30px 18px 100px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px;gap:12px}.heading h2{font-size:25px;margin:0}.heading p{color:var(--muted);font-size:14px;margin:5px 0 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #5b3b1a0a;display:flex;flex-direction:column}.art{aspect-ratio:4/3;display:grid;place-items:center;position:relative;overflow:hidden;background:var(--bg)}.art:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#fff7;top:-80px;right:-45px}.food{font-size:clamp(65px,8vw,95px);filter:drop-shadow(0 10px 5px #52351d2b);z-index:1;transform:translateY(-2px)}.art small{position:absolute;bottom:12px;left:14px;letter-spacing:.15em;font-size:10px;font-weight:900;color:#654a36;opacity:.8}.details{padding:14px;display:flex;flex-direction:column;flex:1}.category{font-size:11px;letter-spacing:.08em;color:var(--green);font-weight:800}.name{font-size:18px;margin:5px 0}.desc{font-size:13px;color:var(--muted);line-height:1.55;margin:0 0 14px;min-height:40px}.price-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}.price{font-weight:850;font-size:17px;white-space:nowrap}.qty{display:flex;align-items:center;gap:10px}.qty button{border:1px solid var(--line);background:#fff8ee;border-radius:50%;width:32px;height:32px;font-size:20px;line-height:1;color:var(--brown)}.qty output{min-width:15px;text-align:center;font-weight:800}.order{margin-top:30px;background:#fffdf9;border:1px solid var(--line);border-radius:20px;padding:22px}.order-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.order h2{margin:0;font-size:22px}.total{font-size:clamp(24px,4vw,34px);font-weight:900;color:var(--brown)}.order-list{margin:16px 0;color:var(--muted);font-size:14px;line-height:1.9}.actions{display:flex;gap:10px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:12px;padding:14px 18px;font-weight:800}.primary{background:var(--brown);color:white;flex:1}.secondary{background:#efe4d6;color:var(--brown)}.notice{display:none;margin-top:16px;padding:15px;border-radius:12px;background:#edf2e8;color:#40543a;line-height:1.6}.notice.show{display:block}.notice strong{display:block;font-size:19px}.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:420px){main{padding:22px 12px 80px}.grid{gap:10px}.details{padding:11px}.name{font-size:16px}.desc{font-size:12px;min-height:56px}.price-row{align-items:flex-start;flex-direction:column}.qty{align-self:flex-end}.heading h2{font-size:22px}}
</style></head><body>
<header><div class="brand">TODAY'S CAFE</div><h1 class="hero-title">오늘의 카페</h1><p class="hero-copy">잠깐의 여유, 달콤한 한입.<br>마음에 드는 메뉴를 골라 주문해 보세요.</p><button class="music" id="musicBtn" aria-pressed="false">♫ 카페 음악 켜기</button></header>
<main><section><div class="heading"><div><h2>오늘의 메뉴</h2><p>메뉴를 고르고 + 버튼으로 수량을 선택해 주세요.</p></div><span class="category">FRESH · SWEET · COZY</span></div><div class="grid" id="menuGrid"></div></section>
<section class="order"><div class="order-top"><h2>나의 주문</h2><div class="total" id="total">0원</div></div><div class="order-list" id="orderList" aria-live="polite">아직 선택한 메뉴가 없습니다.</div><div class="actions"><button class="secondary" id="resetBtn">초기화</button><button class="primary" id="orderBtn">선택 완료하고 주문하기</button></div><div class="notice" id="notice" role="status"><strong>주문해 주셔서 감사합니다!</strong>맛있고 행복한 시간 보내세요. 주문이 접수되었습니다.</div></section><p class="foot">오늘의 카페 · 본 페이지는 주문 화면 체험용이며 실제 결제는 진행되지 않습니다.</p></main>
<script>
const menus=[
{id:'coffee',name:'아이스 커피',price:7000,category:'COFFEE',desc:'깊고 고소한 커피에 얼음을 더해 시원하고 깔끔하게.',emoji:'🧋',bg:'#eadbc5',tag:'COOL & BOLD'},
{id:'milk',name:'우유',price:3000,category:'DRINK',desc:'부드럽고 담백한 풍미로 누구나 편하게 즐기는 한 잔.',emoji:'🥛',bg:'#e7eee5',tag:'FRESH MILK'},
{id:'choco',name:'초코 아이스크림',price:6000,category:'DESSERT',desc:'진한 초콜릿의 달콤함과 시원한 부드러움이 가득.',emoji:'🍨',bg:'#f0dfd1',tag:'CHOCOLATE'},
{id:'vanilla',name:'바닐라 아이스크림',price:5000,category:'DESSERT',desc:'향긋한 바닐라와 크리미한 식감이 어우러진 디저트.',emoji:'🍦',bg:'#f7edcf',tag:'VANILLA'},
{id:'orange',name:'오렌지 주스',price:5000,category:'JUICE',desc:'상큼한 오렌지의 생기와 산뜻함을 담은 주스.',emoji:'🍊',bg:'#f7e4c9',tag:'SUNSHINE JUICE'},
{id:'sandwich',name:'샌드위치',price:5500,category:'BAKERY',desc:'신선한 채소와 속재료를 빵 사이에 듬뿍 담았어요.',emoji:'🥪',bg:'#e7e9d8',tag:'FRESH BAKERY'},
{id:'cake',name:'모카 케이크',price:6000,category:'CAKE',desc:'커피 향 크림과 촉촉한 초콜릿 시트의 달콤한 조화.',emoji:'🍰',bg:'#ead8c9',tag:'MOCHA & CREAM'},
{id:'bingsoo',name:'빙수',price:12000,category:'SPECIAL',desc:'눈꽃처럼 부드러운 얼음 위에 고소하고 달콤한 토핑.',emoji:'🍧',bg:'#e1eaf0',tag:'SNOW FLAKES'}];
const selected=Object.fromEntries(menus.map(m=>[m.id,0]));const money=n=>n.toLocaleString('ko-KR')+'원';const grid=document.getElementById('menuGrid');
menus.forEach(m=>{const el=document.createElement('article');el.className='card';el.innerHTML='<div class="art" style="--bg:'+m.bg+'"><span class="food" role="img" aria-label="'+m.name+' 일러스트">'+m.emoji+'</span><small>'+m.tag+'</small></div><div class="details"><span class="category">'+m.category+'</span><h3 class="name">'+m.name+'</h3><p class="desc">'+m.desc+'</p><div class="price-row"><span class="price">'+money(m.price)+'</span><div class="qty"><button type="button" aria-label="'+m.name+' 수량 줄이기" data-action="minus" data-id="'+m.id+'">−</button><output id="qty-'+m.id+'">0</output><button type="button" aria-label="'+m.name+' 수량 늘리기" data-action="plus" data-id="'+m.id+'">+</button></div></div></div>';grid.appendChild(el)});
function clickSound(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(1000,c.currentTime);o.frequency.exponentialRampToValueAtTime(650,c.currentTime+.045);g.gain.setValueAtTime(.055,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.055);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.06);o.onended=()=>c.close()}catch(e){}}
function render(){let total=0,lines=[];menus.forEach(m=>{const q=selected[m.id];document.getElementById('qty-'+m.id).textContent=q;if(q){total+=q*m.price;lines.push(m.name+' '+q+'개 · '+money(q*m.price))}});document.getElementById('total').textContent=money(total);document.getElementById('orderList').textContent=lines.length?lines.join('　/　'):'아직 선택한 메뉴가 없습니다.';document.getElementById('notice').classList.remove('show')}
grid.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;clickSound();const id=b.dataset.id;if(b.dataset.action==='plus')selected[id]++;else selected[id]=Math.max(0,selected[id]-1);render()});
document.getElementById('resetBtn').addEventListener('click',()=>{clickSound();menus.forEach(m=>selected[m.id]=0);render()});
document.getElementById('orderBtn').addEventListener('click',()=>{clickSound();if(!Object.values(selected).some(n=>n>0)){document.getElementById('orderList').textContent='먼저 원하시는 메뉴를 선택해 주세요.';return}document.getElementById('notice').classList.add('show');if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('주문해 주셔서 감사합니다. 맛있고 행복한 시간 보내세요.');u.lang='ko-KR';u.rate=.95;speechSynthesis.speak(u)}});
let audioCtx=null,musicOn=false,stepTimer=null;function startMusic(){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();const master=audioCtx.createGain();master.gain.value=.025;master.connect(audioCtx.destination);const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];let i=0;const play=()=>{if(!musicOn||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(.001,audioCtx.currentTime);g.gain.linearRampToValueAtTime(.45,audioCtx.currentTime+.12);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+1.3);o.connect(g);g.connect(master);o.start();o.stop(audioCtx.currentTime+1.35)};play();stepTimer=setInterval(play,750)}catch(e){musicOn=false;document.getElementById('musicBtn').textContent='음악을 지원하지 않는 브라우저입니다'}}
document.getElementById('musicBtn').addEventListener('click',()=>{musicOn=!musicOn;const b=document.getElementById('musicBtn');b.setAttribute('aria-pressed',String(musicOn));if(musicOn){b.textContent='♫ 카페 음악 끄기';startMusic()}else{b.textContent='♫ 카페 음악 켜기';clearInterval(stepTimer);if(audioCtx){audioCtx.close();audioCtx=null}}});render();
</script></body></html>
